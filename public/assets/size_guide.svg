<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" fill="#0f0f11"/>
  <!-- Header -->
  <text x="40" y="55" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" letter-spacing="3">WENZY STREETWEAR — SIZE GUIDE</text>
  <text x="40" y="80" fill="#a1a1aa" font-family="system-ui, -apple-system, sans-serif" font-size="12" letter-spacing="1">ALL MEASUREMENTS ARE IN INCHES • OVERSIZED DROP-SHOULDER FIT</text>

  <!-- Table Container -->
  <rect x="40" y="110" width="720" height="340" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1"/>

  <!-- Table Header -->
  <rect x="40" y="110" width="720" height="55" rx="8" fill="#222226"/>
  <text x="70" y="145" fill="#f4f4f5" font-family="system-ui, sans-serif" font-size="13" font-weight="800" letter-spacing="1.5">SIZE</text>
  <text x="220" y="145" fill="#f4f4f5" font-family="system-ui, sans-serif" font-size="13" font-weight="800" letter-spacing="1.5">CHEST (ROUND)</text>
  <text x="410" y="145" fill="#f4f4f5" font-family="system-ui, sans-serif" font-size="13" font-weight="800" letter-spacing="1.5">BODY LENGTH</text>
  <text x="600" y="145" fill="#f4f4f5" font-family="system-ui, sans-serif" font-size="13" font-weight="800" letter-spacing="1.5">SHOULDER</text>

  <!-- Row 1: S -->
  <line x1="40" y1="165" x2="760" y2="165" stroke="#27272a" stroke-width="1"/>
  <text x="70" y="200" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="800">S</text>
  <text x="220" y="200" fill="#d4d4d8" font-family="system-ui, sans-serif" font-size="14">42.0"</text>
  <text x="410" y="200" fill="#d4d4d8" font-family="system-ui, sans-serif" font-size="14">28.0"</text>
  <text x="600" y="200" fill="#d4d4d8" font-family="system-ui, sans-serif" font-size="14">21.0"</text>

  <!-- Row 2: M -->
  <line x1="40" y1="220" x2="760" y2="220" stroke="#27272a" stroke-width="1"/>
  <text x="70" y="255" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="800">M</text>
  <text x="220" y="255" fill="#d4d4d8" font-family="system-ui, sans-serif" font-size="14">44.0"</text>
  <text x="410" y="255" fill="#d4d4d8" font-family="system-ui, sans-serif" font-size="14">29.0"</text>
  <text x="600" y="255" fill="#d4d4d8" font-family="system-ui, sans-serif" font-size="14">22.0"</text>

  <!-- Row 3: L -->
  <line x1="40" y1="275" x2="760" y2="275" stroke="#27272a" stroke-width="1"/>
  <text x="70" y="310" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="800">L</text>
  <text x="220" y="310" fill="#d4d4d8" font-family="system-ui, sans-serif" font-size="14">46.0"</text>
  <text x="410" y="310" fill="#d4d4d8" font-family="system-ui, sans-serif" font-size="14">30.0"</text>
  <text x="600" y="310" fill="#d4d4d8" font-family="system-ui, sans-serif" font-size="14">23.0"</text>

  <!-- Row 4: XL -->
  <line x1="40" y1="330" x2="760" y2="330" stroke="#27272a" stroke-width="1"/>
  <text x="70" y="365" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="800">XL</text>
  <text x="220" y="365" fill="#d4d4d8" font-family="system-ui, sans-serif" font-size="14">48.0"</text>
  <text x="410" y="365" fill="#d4d4d8" font-family="system-ui, sans-serif" font-size="14">31.0"</text>
  <text x="600" y="365" fill="#d4d4d8" font-family="system-ui, sans-serif" font-size="14">24.0"</text>

  <!-- Row 5: 2XL -->
  <line x1="40" y1="385" x2="760" y2="385" stroke="#27272a" stroke-width="1"/>
  <text x="70" y="420" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="800">2XL</text>
  <text x="220" y="420" fill="#d4d4d8" font-family="system-ui, sans-serif" font-size="14">50.0"</text>
  <text x="410" y="420" fill="#d4d4d8" font-family="system-ui, sans-serif" font-size="14">32.0"</text>
  <text x="600" y="420" fill="#d4d4d8" font-family="system-ui, sans-serif" font-size="14">25.0"</text>
</svg>
